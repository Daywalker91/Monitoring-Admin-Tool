# Baut das Server-Image für linux/amd64 und linux/arm64 und legt es in der
# GitHub Container Registry ab: ghcr.io/daywalker91/mat-server
#   main      → :main, :latest, :sha-<kurz>
#   Tag v1.2.3 → :1.2.3, :1.2
# Pushes auf main bauen nur, wenn sich Server-Code geändert hat (Tags immer).
name: server-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Gilt nur für Branches; Tag-Pushes ignorieren Pfadfilter.
    paths:
      - go.mod
      - go.sum
      - proto/**
      - internal/**
      - server/**
      - web/**
      - deploy/Dockerfile
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Prüfen
        run: |
          go vet ./...
          go test ./...

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/daywalker91/mat-server
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bei Tags "v1.2.3" wie die Agenten, sonst z. B. "main".
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
