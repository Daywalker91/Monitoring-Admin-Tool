# Vorlage – NICHT mit echten Werten committen. Einfacher per kubectl anlegen:
#   kubectl -n monitoring create secret generic mat-server-env \
#     --from-literal=MAT_AGENT_TOKEN=$(openssl rand -hex 24) \
#     --from-literal=MAT_METRICS_TOKEN=$(openssl rand -hex 24) \
#     --from-literal=MAT_NTFY_URL=https://ntfy.sh/<topic>
apiVersion: v1
kind: Secret
metadata:
  name: mat-server-env
  namespace: monitoring
type: Opaque
stringData:
  MAT_AGENT_TOKEN: "<mindestens 8 zeichen, besser 32+>"
  # optional:
  # MAT_METRICS_TOKEN: "<mindestens 16 zeichen>"
  # MAT_NTFY_URL: "https://ntfy.sh/<schwer-erratbares-topic>"
  # MAT_NTFY_TOKEN: "tk_..."
  # MAT_SMTP_HOST: "smtp.example.com"
  # MAT_SMTP_USER: "..."
  # MAT_SMTP_PASS: "..."
  # MAT_SMTP_FROM: "Monitoring-Admin-Tool <monitor@example.com>"
  # MAT_SMTP_TO: "ich@example.com"
