# Monitoring and Administration Tool (MAT), Server für k3s.
#   kubectl kustomize deploy/k8s          # ansehen
#   kubectl apply -k deploy/k8s           # anwenden (vorher Secrets anlegen, siehe README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
labels:
  - pairs:
      app.kubernetes.io/name: mat-server
      app.kubernetes.io/part-of: monitoring-admin-tool
resources:
  - namespace.yaml
  - rbac.yaml
  # - rbac-drain.yaml  # optional: drain vor dem Neustart (Nodes absperren, Pods verdrängen)
  - pvc.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/daywalker91/mat-server
    newTag: main
