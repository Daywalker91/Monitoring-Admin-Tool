# Monatlicher Patch-Lauf über die k3s-Nodes: ein Node nach dem anderen
# Paketlisten holen, Updates installieren, Neustart mit drain.
# Voraussetzungen je Host: "jobs": ["packages", "reboot"] in agent.json,
# für den drain die optionale ClusterRole mat-server-drain (deploy/k8s/rbac-drain.yaml).
name: monatlich-patchen
description: k3s-Nodes nacheinander patchen und mit drain neu starten
targets: [k3s]          # Gruppe in MAT (Host-Details → Gruppe); auch Host-IDs oder Anzeigenamen
mode: serial            # ein kaputtes Update geht so nicht nacheinander auf alle Nodes
on_error: stop
# Zeitplan (optional): startet automatisch als Benutzer „zeitplan“, Zeitzone des Servers (TZ).
# Nicht in das Fenster eines k3s-Upgrades legen (system-upgrade-controller).
# schedule: monthly second sat 03:00
steps:
  - id: listen
    action: packages.refresh
  - id: updates
    action: packages.upgrade
  # In M12a gibt es noch keine Bedingung "Neustart nötig": Der Node startet
  # bei jedem Lauf neu (der drain verdrängt die Pods vorher).
  - id: neustart
    action: k3s.drain_reboot
  # Erst weiter, wenn alle Nodes bereit und alle Workloads wieder verfügbar sind
  # (Ausnahmen wie bei den Cluster-Alarmen). Sonst hält der Lauf nach 20 min an.
  - id: cluster-gesund
    gate: cluster_healthy
    timeout: 20m
  - id: durchatmen      # Longhorn Zeit geben, Replikate wieder aufzubauen
    wait: 5m
